<script>
'use strict';
let lastErr='',lastErrT=0;
function showErr(e){
  const m=String(e&&e.message||e),now=Date.now();console.error(e);

  const t=document.getElementById('toast');if(!t)return;t.textContent='Error: '+m;t.hidden=false;setTimeout(()=>{t.hidden=true},3500);
}
addEventListener('error',e=>showErr(e.error||e.message));
addEventListener('unhandledrejection',e=>showErr(e.reason));

const LY_KM=9.4607e12, AU_LY=1/63241.077, RSUN=696000/LY_KM, TAU=Math.PI*2, UR=3e11;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function h32(x,y,z,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1274126177)^Math.imul(s|0,2246822519);h=Math.imul(h^h>>>13,1103515245);h^=h>>>16;return h>>>0}
const hn=(a,b,c)=>h32(a,b,c,7)/4294967296;
function vnoise(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
  let fx=x-xi,fy=y-yi,fz=z-zi;
  fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);fz=fz*fz*(3-2*fz);
  const c000=hn(xi,yi,zi),c100=hn(xi+1,yi,zi),c010=hn(xi,yi+1,zi),c110=hn(xi+1,yi+1,zi);
  const c001=hn(xi,yi,zi+1),c101=hn(xi+1,yi,zi+1),c011=hn(xi,yi+1,zi+1),c111=hn(xi+1,yi+1,zi+1);
  const x00=c000+(c100-c000)*fx,x10=c010+(c110-c010)*fx,x01=c001+(c101-c001)*fx,x11=c011+(c111-c011)*fx;
  const y0=x00+(x10-x00)*fy,y1=x01+(x11-x01)*fy;

function fbm(x,y,z,o){let a=0,amp=.5,n=0;for(let i=0;i<o;i++){a+=amp*vnoise(x,y,z);n+=amp;x*=2.03;y*=2.03;z*=2.03;amp*=.5}return a/n}
function hsl(h,s,l){const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return [f(0),f(8),f(4)]}

const TB=[2800,3300,3800,4400,5000,5700,6400,7500,9000,12000,20000,35000];
function tempRGB(T){const t=T/100;let r,g,b;
  r=t<=66?255:329.698727446*Math.pow(t-60,-0.1332047592);
  g=t<=66?99.4708025861*Math.log(t)-161.1195681661:288.1221695283*Math.pow(t-60,-0.0755148492);
  b=t>=66?255:t<=19?0:138.5177312231*Math.log(t-10)-305.0447927307;
  return [clamp(r,0,255),clamp(g,0,255),clamp(b,0,255)].map(v=>Math.round(v*.8+51))}
const TRGB=TB.map(tempRGB), TCOL=TRGB.map(c=>'rgb('+c.join(',')+')');
function bucketOf(T){let b=0;for(let i=0;i<TB.length;i++)if(T>=TB[i])b=i;return b}
const GLOW=TRGB.map(rgb=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.1,'rgba(255,255,255,.9)');
  gr.addColorStop(.28,'rgba('+rgb.join(',')+',.45)');gr.addColorStop(1,'rgba('+rgb.join(',')+',0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return c});

const SY=['ka','lo','ve','ri','ta','mu','sen','dor','xi','ar','el','ny','ko','zu','pha','ber','oth','il','qua','ra'];
function nameFrom(r){const n=2+(r()*2|0);let s='';for(let i=0;i<n;i++)s+=SY[r()*SY.length|0];return s[0].toUpperCase()+s.slice(1)}
function nameOf(o){if(o.name)return o.name;const r=mulberry(o.seed||1);o.name=nameFrom(r)+' '+(100+(r()*899|0));return o.name}
const ROM=['I','II','III','IV'];

const G=[];
(function(){
  const rng=mulberry(2026);
  G.push({kind:'galaxy',id:0,name:'Vía Láctea',type:'S',c:[0,0,0],R:90000,u:[1,0,0],n:[0,1,0],v:[0,0,1],seed:7,stars:null,spr:null,real:1});
  for(let i=1;i<=60;i++){
    const d=i<=6?6e7+rng()*4e7:1.5e8*(0.8+Math.pow(rng(),1.5)*8), th=rng()*TAU, ph=Math.acos(2*rng()-1);
    const c=[d*Math.sin(ph)*Math.cos(th),d*Math.cos(ph),d*Math.sin(ph)*Math.sin(th)];
    const n=norm([rng()*2-1,rng()*2-1,rng()*2-1]), u=norm(cross(n,[.3,.9,.2+rng()])), v=cross(n,u);
    const nm=rng()<.5?'NGC '+(1000+(rng()*6000|0)):nameFrom(rng)+'-'+(1+(rng()*98|0));
    G.push({kind:'galaxy',id:i,name:nm,type:rng()<.68?'S':'E',c,R:(12000+rng()*55000)*2.3,u,n,v,seed:100+i*31,stars:null,spr:null});
  }
})();

const SPR={};
function getSprite(g){
  if(g.spr)return g.spr;
  const key=g.type+(g.id%8);if(g.far&&SPR[key])return g.spr=SPR[key];
  const S=256,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d'),rng=mulberry(g.far?400+(g.id%8)*7:g.seed),h=S/2;
  x.globalCompositeOperation='lighter';
  if(g.type==='S'){
    const arms=2+(g.id%3);
    for(let i=0;i<10000;i++){
      const r=Math.pow(rng(),.62)*.95+.02, arm=rng()*arms|0;
      const th=arm*TAU/arms+3*Math.log(1+r*8)+(rng()+rng()+rng()-1.5)*(.55-r*.3), k=clamp(r*1.3,0,1);
      x.fillStyle='rgba('+((255-120*k)|0)+','+((220-50*k)|0)+','+((150+105*k)|0)+','+(0.17*(1-r*.5)).toFixed(3)+')';
      x.beginPath();x.arc(h+Math.cos(th)*r*h,h+Math.sin(th)*r*h,1.2+rng()*1.6,0,TAU);x.fill();
    }
    const gr=x.createRadialGradient(h,h,0,h,h,h*.3);gr.addColorStop(0,'rgba(255,230,170,.95)');gr.addColorStop(1,'rgba(255,200,120,0)');
    x.fillStyle=gr;x.fillRect(0,0,S,S);
    for(let i=0;i<70;i++){const r=Math.pow(rng(),.8)*.85+.1,arm=rng()*arms|0,th=arm*TAU/arms+3*Math.log(1+r*8)+(rng()-.5)*.3,px=h+Math.cos(th)*r*h,py=h+Math.sin(th)*r*h,q=2+rng()*5,pg=x.createRadialGradient(px,py,0,px,py,q);pg.addColorStop(0,'rgba(255,110,170,.5)');pg.addColorStop(1,'rgba(255,110,170,0)');x.fillStyle=pg;x.fillRect(px-q,py-q,2*q,2*q)}
    x.globalCompositeOperation='destination-out';
    for(let i=0;i<420;i++){const r=Math.pow(rng(),.7)*.85+.06,arm=rng()*arms|0,th=arm*TAU/arms+3*Math.log(1+r*8)+.2+(rng()-.5)*.18,px=h+Math.cos(th)*r*h,py=h+Math.sin(th)*r*h,q=2+rng()*6,dg=x.createRadialGradient(px,py,0,px,py,q);dg.addColorStop(0,'rgba(0,0,0,.35)');dg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=dg;x.fillRect(px-q,py-q,2*q,2*q)}
    x.globalCompositeOperation='lighter';
  }else{
    const gr=x.createRadialGradient(h,h,0,h,h,h);
    gr.addColorStop(0,'rgba(255,225,170,.95)');gr.addColorStop(.35,'rgba(255,190,120,.4)');gr.addColorStop(1,'rgba(255,170,100,0)');
    x.fillStyle=gr;x.fillRect(0,0,S,S);
  }
  if(g.far)SPR[key]=c;return g.spr=c;
}
function genGalStars(g){
  const rng=mulberry(g.seed*977+13),N=g.type==='S'?16000:9000;
  const P=new Float64Array(N*3),L=new Float32Array(N),B=new Uint8Array(N),gs=()=>rng()+rng()+rng()-1.5;
  for(let i=0;i<N;i++){
    let x,y,z,bu=0;
    if(g.type==='S'){

function earthTexFromMap(p){
  const w=1024,h=512,N=w*h,t=mkCan(w,h),x=t.getContext('2d'),img=x.createImageData(w,h),d=img.data,ci=x.createImageData(w,h),cd=ci.data,ni=p.lights?x.createImageData(w,h):null,nd=ni&&ni.data,M=earthPx,lf=new Float32Array(N),ic=new Float32Array(N);

let landLock=false;
function frame(now){
  try{
    const dt=Math.min(.05,Math.max(.001,(now-last)/1000));last=now;
